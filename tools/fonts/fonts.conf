<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<!-- What fonts this machine has, and what the generic families mean.

     fontconfig is compiled with FONTCONFIG_PATH "/etc/fonts", so this file
     is the one it looks for and the one whose absence it reports as
     "Cannot load default config file". A machine with no such file has no
     fonts at all as far as every program that asks fontconfig is concerned,
     which on this one was every program that draws text that was not drawn
     by this project itself.

     It is deliberately short. The configuration shipped with fontconfig is
     thirty files of rules about hinting, synthetic emboldening, language
     matching and the peculiarities of particular typefaces - all of which
     describe a machine with hundreds of fonts and a person with opinions.
     This machine has one family in four styles, so what has to be said is
     where they are and which of them a generic name means. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>

  <!-- fontconfig writes a cache of what it found, and it must be somewhere
       writable: /tmp is the only such place a program here can count on. -->
  <cachedir>/tmp/fontconfig</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>cursive</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>fantasy</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
  </match>

  <!-- The last resort, for a request naming a family nothing here has. A
       pattern that matches nothing is what produces "Could not find any
       font", and a browser asked to lay out text with no font at all has
       nothing to measure. -->
  <alias>
    <family>DejaVu Sans</family>
    <default><family>sans-serif</family></default>
  </alias>
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
