# .github/workflows/tests.yml - Q10
#
# Until this file, ninety-three milestones had been graded by a person who
# remembered to run two scripts. That worked, and it worked because one
# person wrote all of it. It is not a thing to keep relying on.
#
# The tiers here are the ones tools/run-tests.sh defines, and they are
# arranged by what they cost:
#
#   host          every push. No QEMU, no cross-toolchain, under a minute.
#                 This is the check that can be required on a pull
#                 request without anyone minding.
#   boot          pushes to main, and pull requests. Builds the image and
#                 grades every boot marker and every performance budget.
#   nightly       the full interactive suite, the slow host tests that
#                 exhaust real resources, and a real fuzzing campaign.
#
# The artifacts matter as much as the verdict. A CI failure whose
# framebuffer you cannot look at is a CI failure you re-run.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:00 UTC. Nightly, and deliberately not on every push - the full
    # interactive suite boots a guest per test.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  host:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No cross-toolchain, no QEMU, no OVMF. That is the whole point of
      # this job: the fast tier is fast because it needs none of them, and
      # a job that needed them would not be fast.
      - name: build and run the host tier
        run: make test-fast

      - name: build and run the host tier without sanitizers
        # ASan changes timing and hides nothing, but it also changes which
        # code paths the optimiser produces. Cheap to check both.
        run: make test-fast TEST_SAN=0

  boot:
    name: boot self-tests and performance budgets
    runs-on: ubuntu-latest
    # The slow part of this job is the cross-toolchain, so it is worth
    # letting the fast one report first.
    needs: host
    steps:
      - uses: actions/checkout@v4

      - name: install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm mtools qemu-system-x86 clang lld \
                                  gcc-x86-64-linux-gnu build-essential

      # The cross-compiler is the only genuinely fiddly dependency.
      # x86_64-elf-gcc is not packaged on Ubuntu; the Linux cross-compiler
      # is, and it produces the same freestanding ELF objects for these
      # flags. Pinned here rather than in the Makefile so a developer's
      # own x86_64-elf toolchain keeps being used locally.
      - name: point the build at the packaged cross-compiler
        run: |
          echo "CC=x86_64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "LD=x86_64-linux-gnu-ld" >> "$GITHUB_ENV"

      - name: cache the OVMF firmware
        uses: actions/cache@v4
        with:
          path: build/ovmf
          key: ovmf-${{ hashFiles('tools/build-ovmf.sh') }}

      - name: build the image
        run: make all

      - name: boot, graded against every marker and every budget
        run: ./tools/qemu-serial-test.sh

      # Kept whether or not the run passed. A green run's numbers are how
      # a trend becomes visible; a red run's log is the investigation.
      - name: keep the measurements and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-measurements
          path: |
            build/perf-history.tsv
            build/test-history.tsv
          if-no-files-found: ignore

  interactive:
    name: interactive suite (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: boot
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm mtools qemu-system-x86 clang lld \
                                  gcc-x86-64-linux-gnu build-essential python3
      - name: point the build at the packaged cross-compiler
        run: |
          echo "CC=x86_64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "LD=x86_64-linux-gnu-ld" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/ovmf
          key: ovmf-${{ hashFiles('tools/build-ovmf.sh') }}
      - name: everything
        run: ./tools/run-tests.sh --full

      # The framebuffer is the evidence for anything that grades pixels.
      - name: keep the framebuffers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framebuffers
          path: |
            build/visual-diff/
            build/*.ppm
            build/*.png
          if-no-files-found: ignore

  fuzz:
    name: fuzzing (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      # Half an hour per target rather than the sixty seconds `make
      # fuzz-run` does locally. A minute is a smoke test; this is a
      # campaign, and it is why it runs at night.
      - name: fuzz
        run: make fuzz-run FUZZ_SECONDS=1800

      # A crashing input is the most valuable artifact this whole file can
      # produce. It goes in tests/corpus/ and becomes a permanent
      # regression test.
      - name: keep any crashing input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
